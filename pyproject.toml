[project]
name = "event-extraction"
version = "0.1.0"
description = "DuEE 1.0 Top10 Event Extraction with RoBERTa+CRF"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

# ==================== 核心运行时依赖 ====================
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "omegaconf>=2.3.0",
    "datasets>=2.14.0",
    "typing-extensions>=4.7.0",
    "pytorch-crf>=0.7.2",
]

# ==================== 依赖分组 ====================
[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pyright[nodejs]>=1.1.411",
    "pytest-cov>=7.1.0",
    "nvidia-ml-py>=13.610.43",
    "black>=23.0.0",
    "pre-commit>=3.5.0",
]

train = [
    "mlflow>=3.14.0",
    "psutil>=7.2.2",
    "seqeval>=1.2.2",
    "scikit-learn>=1.3.0",
]

serve = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.1.0",
]

export = [
    "onnxruntime-gpu>=1.16.0",
    "optimum>=1.14.0",
]

# ==================== uv 专属配置 ====================
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = [
    "https://pypi.mirrors.ustc.edu.cn/simple/",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ==================== 类型检查配置 ====================
[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalMemberAccess = "none"
reportGeneralTypeIssues = "none"
pythonVersion = "3.12"

[tool.pylance]
typeCheckingMode = "basic"

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.models.*"
strict = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_errors = true

# ==================== Ruff 配置 ====================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["event_extraction"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==================== Pytest 配置 ====================
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--cov=src/ --cov-report=term --cov-fail-under=80"
pythonpath = ["."]

markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
]

# ==================== 其他工具配置 ====================
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["event_extraction"]
